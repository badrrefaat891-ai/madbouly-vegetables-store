<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً - متجر مدبولي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        
        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .link-btn {
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .btn-store {
            background: #16a34a;
            color: white;
            border-color: #16a34a;
        }
        
        .btn-store:hover {
            background: white;
            color: #16a34a;
            transform: scale(1.05);
        }
        
        .btn-clock {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .btn-clock:hover {
            background: white;
            color: #667eea;
            transform: scale(1.05);
        }
        
        .status {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            color: #0369a1;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 مرحباً بك!</h1>
        <p>موقعك شغال بنجاح! اختر من الخيارات التالية:</p>
        
        <div class="links">
            <a href="index.html" class="link-btn btn-store">
                🥬 متجر الخضار والفاكهة
            </a>
            <a href="clock.html" class="link-btn btn-clock">
                🕐 الساعة العالمية
            </a>
        </div>
        
        <div class="status">
            ✅ GitHub Pages مفعّلة بنجاح!
            <br>
            <small>آخر تحديث: الآن</small>
        </div>
    </div>
</body>
</html>
